spring.application.name=server
spring.main.web-application-type=none

# ============================================================
# Local PostgreSQL 18 DataSource Configuration (online_exam_db)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/online_exam_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# HikariCP Cloud Connection Pool Tuning
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# ============================================================
# Hibernate & JPA Configuration (3NF Schema Preservation)
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# C Communication Engine (TCP Gateway) Configuration
# ============================================================
mooc.gateway.host=${GATEWAY_HOST:127.0.0.1}
mooc.gateway.port=${GATEWAY_PORT:9000}
mooc.gateway.enabled=${GATEWAY_ENABLED:true}
