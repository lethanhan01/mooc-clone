spring.application.name=server

# ============================================================
# Supabase PostgreSQL DataSource Configuration
# Using Supabase Pooler (Region: ap-south-1, IPv4 compatible)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.sijjqpfyxccrswiqthxn}
spring.datasource.password=${DB_PASSWORD:Nh8jXnH76qEI5WfC}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# HikariCP Cloud Connection Pool Tuning
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# ============================================================
# Hibernate & JPA Configuration (3NF Schema Preservation)
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
