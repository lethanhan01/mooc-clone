name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codebase-metrics:
    name: Codebase metrics (cloc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloc

      - name: Count files and lines by language
        run: >-
          cloc .
          --exclude-dir=node_modules,dist,build,coverage,.next,.git,.cache
          --not-match-f='^generated\.css$'

  client:
    name: Client (lint • test • build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test:coverage --if-present
        env:
          CI: true

      - name: Upload client coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-coverage
          path: client/coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build --if-present

      - name: Upload client build artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-dist
          path: client/dist
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Server (lint • test • build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://gym:gym@localhost:5432/gym_test
      JWT_SECRET: test-secret-please-change
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Block destructive database commands
        run: npm run db:safety:check

      - name: Lint
        run: npm run lint --if-present

      - name: Test with coverage gate
        run: npm run test:cov -- --runInBand
        env:
          CI: true

      - name: Verify LCOV report
        if: success()
        run: test -s coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-coverage
          path: server/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build --if-present

  sonar:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    needs: [client, server]
    if: >-
      always() &&
      needs.client.result == 'success' &&
      needs.server.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download client coverage
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: client-coverage
          path: client/coverage
        continue-on-error: true

      - name: Download server coverage
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: server-coverage
          path: server/coverage
        continue-on-error: true

      - name: Check SonarQube Cloud configuration
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube Cloud scan skipped. Secret SONAR_TOKEN is not configured."
            exit 0
          fi

          echo "🔍 Kiểm tra tính hợp lệ của SONAR_TOKEN với SonarQube Cloud API..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${SONAR_TOKEN}:" https://api.sonarcloud.io/analysis/engine || echo "000")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${SONAR_TOKEN}" https://api.sonarcloud.io/analysis/engine || echo "000")
          fi

          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ SONAR_TOKEN hợp lệ. Sẵn sàng phân tích mã nguồn."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN bị từ chối bởi SonarCloud (HTTP $HTTP_STATUS). Bỏ qua bước scan để không làm fail Pull Request. Vui lòng tạo lại User Token trên https://sonarcloud.io/account/security."
          fi

      - name: SonarQube Cloud scan
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.scanner.skipJreProvisioning=true

  server-docker:
    name: Server (Docker build & push)
    runs-on: ubuntu-latest
    needs: [server]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: server
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/server' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    name: Server (Deploy to VPS via Self-hosted Runner)
    runs-on: [self-hosted]
    needs: [server-docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/server' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VPS
        shell: bash
        env:
          CONFIGURED_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || secrets.VPS_DEPLOY_PATH }}
          SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
        run: |
          set -euo pipefail

          # 1. Xác định thư mục chứa mã nguồn và file .env trên VPS
          DEPLOY_DIR="${CONFIGURED_DEPLOY_PATH:-}"
          if [[ -z "$DEPLOY_DIR" ]]; then
            if [[ -f "$HOME/gym-management-system/server/.env" ]]; then
              DEPLOY_DIR="$HOME/gym-management-system/server"
            elif [[ -f "/opt/gym-management-system/server/.env" ]]; then
              DEPLOY_DIR="/opt/gym-management-system/server"
            elif [[ -f "$GITHUB_WORKSPACE/server/.env" ]]; then
              DEPLOY_DIR="$GITHUB_WORKSPACE/server"
            else
              echo "❌ Lỗi: Không thể tự động phát hiện thư mục deploy có file .env!"
              echo "👉 Vui lòng tạo Repository Variable 'VPS_DEPLOY_PATH' trong GitHub Settings (ví dụ: /home/ubuntu/gym-management-system/server hoặc /opt/gym-management-system/server)."
              exit 1
            fi
          fi

          echo "📂 Thư mục deploy mục tiêu trên VPS: $DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # 2. Đồng bộ các file cấu hình mới nhất từ repository vào thư mục deploy
          echo "📋 Đồng bộ docker-compose.yml, prisma schema và deploy.sh..."
          cp "$GITHUB_WORKSPACE/server/docker-compose.yml" ./docker-compose.yml
          cp "$GITHUB_WORKSPACE/server/deploy.sh" ./deploy.sh
          chmod +x ./deploy.sh
          mkdir -p ./prisma
          cp -r "$GITHUB_WORKSPACE/server/prisma/"* ./prisma/
          if [[ -f "$GITHUB_WORKSPACE/server/prisma.config.ts" ]]; then
            cp "$GITHUB_WORKSPACE/server/prisma.config.ts" ./prisma.config.ts
          fi

          # 3. Kích hoạt quy trình deploy an toàn
          export SERVER_IMAGE="${SERVER_IMAGE}:latest"
          export DEPLOY_MODE=pull
          export RUN_PRISMA_PUSH=true

          bash ./deploy.sh

